template: homeassistant
products:
  - brand: Home Assistant
auth:
  type: homeassistant
  params: [uri, insecure]
params:
  - name: uri
    required: true
    example: http://homeassistant.local:8123
    description:
      de: Home Assistant URI
      en: Home Assistant URI
    help:
      en: " " # overwrite default
      de: " " # overwrite default
    service: homeassistant/instances
  - name: notify
    example: notify.mobile_app_android
    description:
      de: Benachrichtigungsdienst
      en: Notify service
    help:
      de: >
        Home Assistant Benachrichtigungsdienst in der Form `domain.service` (z. B. `notify.mobile_app_android`).
        Leer lassen, um eine persistente Benachrichtigung in der HA-Oberfläche zu erstellen.
      en: >
        Home Assistant notify service in the form `domain.service` (e.g. `notify.mobile_app_android`).
        Leave empty to create a persistent notification in the HA UI.
    service: homeassistant/services?uri={uri}&insecure={insecure}&domain=notify
  - name: insecure
  - name: critical
    type: bool
    default: false
    description:
      de: Kritische Benachrichtigung
      en: Critical notification
    help:
      de: Setzt ttl=0 und priority=high für sofortige Zustellung, auch im Energiesparmodus.
      en: Sets ttl=0 and priority=high for immediate delivery even in battery saver mode.
  - name: group
    example: evcc
    description:
      de: Benachrichtigungsgruppe
      en: Notification group
    help:
      de: Gruppiert Benachrichtigungen auf dem Gerät. Gleiche Gruppe fasst Meldungen zusammen.
      en: Groups notifications on the device. Same group collapses multiple alerts together.
  - name: notification_channel
    example: alarm_stream
    description:
      de: Benachrichtigungskanal
      en: Notification channel
    help:
      de: Android-Benachrichtigungskanal (bestimmt Ton und Priorität). Z. B. `alarm_stream` für Alarmton.
      en: Android notification channel (controls sound and importance). E.g. `alarm_stream` for alarm sound.
  - name: notification_icon
    example: mdi:ev-station
    description:
      de: Benachrichtigungssymbol
      en: Notification icon
    help:
      de: Material Design Icon für die Benachrichtigung, z. B. `mdi:ev-station`.
      en: Material Design Icon for the notification, e.g. `mdi:ev-station`.
  - name: color
    example: "#0fde49"
    description:
      de: Benachrichtigungsfarbe
      en: Notification color
    help:
      de: Farbe der Benachrichtigung als Hex-Code oder Name. Unter iOS die Hintergrundfarbe des Symbols.
      en: Notification color as hex code or name. On iOS the background color of the icon.
  - name: url
    example: "https://example.com/"
    description:
      de: Link bei Klick (iOS)
      en: Click URL (iOS)
    help:
      de: Wird beim Anklicken der Benachrichtigung geöffnet (iOS). Kann eine relative URL zu deiner Home Assistant-Instanz sein, wie etwa /lovelace/test, oder eine vollständige URL, wie beispielsweise https://example.com.
      en: Opened when you click the notification (iOS). Can be a relative URL to your Home Assistant instance, like /lovelace/test or a full URL like https://example.com.
  - name: click_action
    example: "https://example.com/"
    description:
      de: Link bei Klick (Android)
      en: Click URL (Android)
    help:
      de: Wird beim Anklicken der Benachrichtigung geöffnet (Android). Kann eine relative URL zu deiner Home Assistant-Instanz sein, wie etwa /lovelace/test, oder eine vollständige URL, wie beispielsweise https://example.com.
      en: Opened when you click the notification (Android). Can be a relative URL to your Home Assistant instance, like /lovelace/test or a full URL like https://example.com.
  - name: interruption_level
    example: time-sensitive
    description:
      de: Unterbrechungsgrad (iOS)
      en: Interruption level (iOS)
    help:
      de: Kann einen der folgenden Zustände annehmen, „passive“, „active“, „time-sensitive“, „critical“. Siehe https://companion.home-assistant.io/docs/notifications/notifications-basic/#interruption-level.
      en: Can be any of the following states, "passive", "active", "time-sensitive", "critical". See https://companion.home-assistant.io/docs/notifications/notifications-basic/#interruption-level.
render: |
  type: homeassistant
  uri: {{ .uri }}
  insecure: {{ .insecure }}
  {{- if .notify }}
  notify: {{ .notify }}
  {{- end }}
  {{- if or .critical .group .notification_channel .notification_icon .color .url .click_action .interruption_level }}
  data:
    {{- if .critical }}
    ttl: 0
    priority: high
    {{- end }}
    {{- if .group }}
    group: {{ .group }}
    {{- end }}
    {{- if .notification_channel }}
    channel: {{ .notification_channel }}
    {{- end }}
    {{- if .notification_icon }}
    notification_icon: {{ quote .notification_icon }}
    {{- end }}
    {{- if .color }}
    color: {{ quote .color }}
    {{- end }}
    {{- if .url }}
    url: {{ quote .url }}
    {{- end }}
    {{- if .click_action }}
    clickAction: {{ quote .click_action }}
    {{- end }}
    {{- if .interruption_level }}
    push:
      interruption-level: {{ quote .interruption_level }}
    {{- end }}
  {{- end }}
